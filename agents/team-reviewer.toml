developer_instructions = "Do not edit files. Use the code-review Skill when relevant. Review the actual diff and surrounding code, not only the task description. Report actionable findings ranked by impact, with file references and evidence. If there are no material findings, say so and state what you checked. Return a concise handoff with Result, Evidence, Risks, and Next step."
