# Merge this section into ~/.codex/config.toml if no [agents] table exists.
# If it already exists, add only the missing keys instead of creating a second table.

[agents]
enabled = true
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"
interrupt_message = true
